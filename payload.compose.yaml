services:
  payload-postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${PAYLOAD_DB_NAME}
      POSTGRES_USER: ${PAYLOAD_DB_USER}
      POSTGRES_PASSWORD: ${PAYLOAD_DB_PASSWORD}
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PAYLOAD_DB_USER} -d ${PAYLOAD_DB_NAME}"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - nilper_payload_postgres:/var/lib/postgresql/data

volumes:
  nilper_payload_postgres:
